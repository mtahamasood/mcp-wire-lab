name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Versions
        run: |
          node --version
          python3 --version
          uv --version
      - run: scripts/bootstrap.sh
      - run: scripts/gate.sh
      # A failed recording keeps the client's own error in runs/<time>-<name>/stderr.txt; keep each
      # run's trace and stderr so a red gate can be read without re-running it (phase 8 D3). Not
      # bin/ (links to the runner's node and python3) and not home/.
      - name: Upload run traces and stderr
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: |
            runs/*/trace.jsonl
            runs/*/stderr.txt
          if-no-files-found: ignore
          retention-days: 7
